<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15324e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hangcha StockCount · 离线盘库</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><div class="logo">H</div><div><strong>StockCount</strong><small>HANGCHA · 离线盘库</small></div></div><span id="offlineBadge" class="badge">本地模式 · v0.3.6</span></header>
<main>
<section id="home" class="view active"><div class="hero"><h1>盘库工作台</h1></div><div class="panel"><label>盘点人 <span class="required">*</span></label><input id="worker" autocomplete="name" placeholder="输入姓名 / 工号"><label>盘库批次</label><input id="session" placeholder="例如 2026年度盘库"><div class="split"><div class="metric"><b id="recordCount">0</b><small>有效记录</small></div><div class="metric"><b id="catalogCount">0</b><small>库存基准行</small></div></div><button class="primary" id="start">开始盘库 <span>→</span></button></div><div class="panel"><h3>库存基准（保存在本机）</h3><label class="filebtn">导入库存 JSON<input type="file" id="catalogFile" accept=".json,application/json" hidden></label><p id="catalogInfo" class="muted mini">尚未导入库存基准</p></div><div class="panel"><h3>导出与备份</h3><button class="secondary" id="exportHome">导出本机全部盘点记录 (.json)</button></div></section>
<section id="count" class="view"><div class="progress"><span id="stepNumber">1 / 11</span><span id="stepName">选择物理楼层</span></div><div class="progressbar"><span id="progressFill"></span></div><div class="location-card"><div class="location-head"><div class="location-summary"><small>当前实际库位</small><div id="locPreview" role="status" aria-live="polite">—</div></div><button id="changeFloor" class="floor-switch" type="button" aria-label="切换物理楼层">选楼层</button></div><div id="locationTrail" class="location-trail" aria-label="点击定位路径返回修改库位"></div></div><div id="stepArea"></div><button class="shelf-quiet" id="completeShelf" type="button">✓ 标记本货架已盘完</button><div class="bottom-actions"><button class="ghost" id="backBtn">← 上一步</button><button class="secondary" id="skipBtn" style="display:none">到此结束库位</button><button class="primary" id="nextBtn">继续 →</button></div></section>
<section id="history" class="view"><div class="row-head"><h2>盘点记录</h2><button class="tiny" id="exportHistory">导出备份</button></div><div id="recordsList"></div><h3>已完成货架（可以撤销） <span id="shelfCount" class="muted mini">0</span></h3><div id="shelfList"></div></section>
<section id="settings" class="view"><h2>设置与说明</h2><div class="panel"><h3>本地数据安全</h3><p>所有库存与盘点记录保存在当前手机浏览器的 IndexedDB 中。网页不主动上传数据，也不修改 ERP。</p><button class="secondary" id="persistBtn">请求浏览器持久化存储</button><p class="mini muted" id="persistStatus"></p></div><div class="panel"><h3>导出</h3><button class="primary" id="exportSettings">导出全部盘点记录</button></div><div class="panel danger"><h3>危险操作</h3><p class="mini muted">只有在电脑成功接收导出文件后才能清空。</p><button class="outline-danger" id="clearRecords">清空本机盘点记录</button></div><p class="mini muted">v0.3.6 · 完全离线数据模式 · 单设备本地保存</p></section>
</main><nav><button data-view="home" class="active">⌂<small>首页</small></button><button data-view="count">▣<small>盘点</small></button><button data-view="history">☷<small>记录</small></button><button data-view="settings">⚙<small>设置</small></button></nav><div id="toast" role="status"></div><div id="saveFeedback" role="status" aria-live="polite"><span class="save-mark">✓</span><strong id="savedLocation">已保存</strong><small id="savedQuantity"></small></div><script src="app.js"></script></body></html>
